<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Palpites da Michelly 🐔</title>

<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2d6a1e">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Fredoka', Arial, sans-serif;
    background: linear-gradient(180deg, #87CEEB 0%, #a8e6a1 40%, #f4e4bc 100%);
    background-attachment: fixed;
    color: #2d3a1e;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== HEADER ===== */
  header {
    background: linear-gradient(135deg, #2d6a1e 0%, #3d8b27 50%, #5a9e3a 100%);
    color: #fff;
    padding: 18px 12px 14px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 15px rgba(0,0,0,.25);
    border-bottom: 4px solid #f4c430;
  }

  header h1 {
    font-size: 1.55rem;
    font-weight: 700;
    text-shadow: 2px 2px 0 #1a4a12;
    letter-spacing: 0.5px;
  }

  header h1:first-child {
    font-size: 1.1rem;
    opacity: 0.95;
    margin-bottom: 2px;
  }

  #data-hora {
    margin-top: 8px;
    font-size: 0.95rem;
    background: rgba(255,255,255,0.15);
    display: inline-block;
    padding: 4px 14px;
    border-radius: 20px;
  }

  /* ===== MAIN ===== */
  main {
    padding: 16px 12px 100px;
    max-width: 920px;
    margin: auto;
  }

  .loading, .erro, .card {
    background: #fffef5;
    border-radius: 18px;
    padding: 16px;
    box-shadow: 0 6px 18px rgba(0,0,0,.12);
    margin-bottom: 18px;
    border: 3px solid #e8d48b;
    position: relative;
    overflow: hidden;
    animation: entrar 0.5s ease;
  }

  @keyframes entrar {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card::before {
    content: "🌾";
    position: absolute;
    top: 8px;
    right: 12px;
    font-size: 1.4rem;
    opacity: 0.7;
  }

  .top-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 700;
    color: #2d6a1e;
    font-size: 1.15rem;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 2px dashed #d4c48a;
  }

  .top-card span:first-child {
    background: #fff3cd;
    padding: 4px 10px;
    border-radius: 12px;
  }

  .lista-milhares {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 10px;
    margin: 14px 0;
  }

  .milhar-card {
    background: linear-gradient(145deg, #fff9e6, #fef3c7);
    border: 2px solid #f0d78c;
    border-radius: 14px;
    padding: 10px 6px;
    text-align: center;
    transition: transform 0.25s, box-shadow 0.25s;
    animation: balancar 3s ease-in-out infinite;
  }

  .milhar-card:nth-child(2) { animation-delay: 0.3s; }
  .milhar-card:nth-child(3) { animation-delay: 0.6s; }
  .milhar-card:nth-child(4) { animation-delay: 0.9s; }

  .milhar-card:hover {
    transform: scale(1.08) rotate(-2deg);
    box-shadow: 0 8px 16px rgba(0,0,0,.15);
  }

  @keyframes balancar {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(1.5deg); }
    75% { transform: rotate(-1.5deg); }
  }

  .milhar-numero {
    font-size: 1.6rem;
    font-weight: 700;
    color: #b45309;
    text-shadow: 1px 1px 0 #fff;
  }

  .botoes {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }

  button {
    flex: 1;
    background: linear-gradient(180deg, #3d8b27, #2d6a1e);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 12px 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.95rem;
    box-shadow: 0 4px 0 #1a4a12;
    transition: all 0.2s;
  }

  button:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #1a4a12;
  }

  /* ===== FOOTER ===== */
  footer {
    background: linear-gradient(90deg, #2d6a1e, #3d8b27, #2d6a1e);
    padding: 12px 8px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
    box-shadow: 0 -4px 15px rgba(0,0,0,.2);
    border-top: 3px solid #f4c430;
  }

  footer button {
    max-width: 110px;
    font-size: 0.85rem;
    padding: 10px 6px;
  }

  .btn-jogar {
    background: linear-gradient(45deg, #ffcc00, #ff8c00, #ff6a00) !important;
    color: #3d2a00 !important;
    box-shadow: 0 4px 0 #c45c00 !important;
    animation: pulsar 1.2s infinite;
    font-weight: 700;
  }

  @keyframes pulsar {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  /* ===== TOAST ===== */
  .mensagem-copy {
    position: fixed;
    left: 50%;
    bottom: 90px;
    transform: translateX(-50%);
    background: #2d3a1e;
    color: #fff;
    padding: 12px 22px;
    border-radius: 30px;
    opacity: 0;
    transition: .3s;
    z-index: 200;
    font-weight: 600;
    box-shadow: 0 6px 20px rgba(0,0,0,.3);
  }
  .mensagem-copy.mostrar { opacity: 1; }

  /* ===== CONTROLE DE MÚSICA ===== */
  .music-control {
    position: fixed;
    top: 90px;
    right: 14px;
    z-index: 150;
    background: rgba(255,255,255,0.9);
    border: 3px solid #f4c430;
    border-radius: 50%;
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(0,0,0,.2);
    transition: transform 0.2s;
  }
  .music-control:hover { transform: scale(1.1); }
  .music-control.muted { opacity: 0.6; }

  /* Decorações flutuantes */
  .decoracao {
    position: fixed;
    font-size: 1.8rem;
    opacity: 0.25;
    pointer-events: none;
    z-index: 0;
    animation: flutuar 8s ease-in-out infinite;
  }
  .d1 { top: 20%; left: 5%; animation-delay: 0s; }
  .d2 { top: 45%; right: 8%; animation-delay: 2s; }
  .d3 { top: 70%; left: 10%; animation-delay: 4s; }
  .d4 { top: 30%; right: 15%; animation-delay: 1s; }

  @keyframes flutuar {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-18px) rotate(8deg); }
  }
</style>
</head>
<body>

<!-- Decorações de fazenda -->
<div class="decoracao d1">🐔</div>
<div class="decoracao d2">🐄</div>
<div class="decoracao d3">🌾</div>
<div class="decoracao d4">🐷</div>

<!-- Controle de música -->
<div class="music-control" id="btnMusica" title="Ligar/Desligar música">🎵</div>

<header>
  <h1>🐔 PALPITES DA MICHELLY 🐔</h1>
  <h1>🇧🇷 Banca Brasileira</h1>
  <div id="data-hora"></div>
</header>

<main id="lista-palpite">
  <div class="loading">🌾 Carregando palpites da fazenda...</div>
</main>

<footer>
  <button>Suporte</button>
  <button>Compartilhar</button>
  <button id="instalarApp">📥 Download</button>
  <button class="btn-jogar" onclick="window.open('https://app.bancabrasileira.com.br/pr/uVZ2pAvP','_blank')">🎰 JOGAR</button>
</footer>

<!-- Música de fazenda (ambiente rural) -->
<audio id="musicaFazenda" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/24/audio_4e0e6b5b5a.mp3?filename=farm-ambient-110177.mp3" type="audio/mpeg">
  <!-- Fallback caso o link acima falhe -->
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js');}
let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
document.addEventListener('click',async e=>{
if(e.target.id==='instalarApp'){
if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;}
else alert('Use o menu do navegador e escolha Adicionar à tela inicial.');
}});

const API_URL='https://script.google.com/macros/s/AKfycbz5IvvaLjGuhvBD6xHAwuTsVBA9wEFu2t4rbgpwx4YMc6B-_bhhNY1WwkEAvPfQoogXsw/exec';
const lista=document.getElementById('lista-palpite');

async function carregarPalpites(){try{const r=await fetch(API_URL);const j=await r.json();lista.innerHTML='';
(j.data||[]).forEach(p=>{const c=document.createElement('div');c.className='card';c.innerHTML=`<div class="top-card"><span>🐾 ${p.animal}</span><span>Grupo ${p.grupo}</span></div><div><b>Loteria:</b> ${p.loteria}<br><b>Próximo:</b> ${p.horario}</div><div class="lista-milhares">${p.milhares.map((m,i)=>`<div class="milhar-card"><div class="milhar-numero">${m.milhar}</div><div>${i+1}º<br>Dz ${m.dezena}</div></div>`).join('')}</div><div class="botoes"><button onclick='compartilhar(${JSON.stringify(p)})'>📲 Compartilhar</button><button onclick='copiarMilhar(${JSON.stringify(p)})'>📋 Copiar</button></div>`;lista.appendChild(c);});}catch(e){lista.innerHTML='<div class="erro">Erro ao carregar.</div>';}}

function compartilhar(p){
  const agora = new Date();
  const data = agora.toLocaleDateString('pt-BR');
  const hora = agora.toLocaleTimeString('pt-BR',{
    hour:'2-digit',
    minute:'2-digit'
  });
  const listaMilhares = p.milhares
    .map(m => m.milhar)
    .join('\n');
  const texto = `📅 Data: ${data}
🕒 Horário: ${hora}
🎰 Loteria: ${p.loteria}
⏳ Próxima Extração: ${p.horario}
🐾 Animal: ${p.animal}
🎯 Grupo: ${p.grupo}
🔥 PALPITES DA MICHELLY
----------------------------------
💎 Milhar:
${listaMilhares}
🍀 Boa sorte!
🌐 palpite.bancabrasileira.site`;
  const url = `https://wa.me/?text=${encodeURIComponent(texto)}`;
  window.open(url,'_blank');
}

function copiarMilhar(p){navigator.clipboard.writeText(p.milhares.map(x=>x.milhar).join(', '));mostrar('Milhares copiadas! 🐔')}
function mostrar(t){let d=document.createElement('div');d.className='mensagem-copy';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.classList.add('mostrar'),50);setTimeout(()=>d.remove(),2500);}
function relogio(){document.getElementById('data-hora').textContent='📅 '+new Date().toLocaleString('pt-BR')}
carregarPalpites();relogio();setInterval(relogio,1000);setInterval(carregarPalpites,60000);

/* ===== CONTROLE DA MÚSICA ===== */
const audio = document.getElementById('musicaFazenda');
const btnMusica = document.getElementById('btnMusica');
let musicaLigada = false;

btnMusica.addEventListener('click', () => {
  if (musicaLigada) {
    audio.pause();
    btnMusica.textContent = '🔇';
    btnMusica.classList.add('muted');
    musicaLigada = false;
  } else {
    audio.volume = 0.35; // volume baixo e agradável
    audio.play().catch(() => {});
    btnMusica.textContent = '🎵';
    btnMusica.classList.remove('muted');
    musicaLigada = true;
  }
});

// Tenta iniciar a música depois da primeira interação do usuário
document.body.addEventListener('click', function iniciarMusica() {
  if (!musicaLigada) {
    audio.volume = 0.35;
    audio.play().then(() => {
      musicaLigada = true;
      btnMusica.textContent = '🎵';
      btnMusica.classList.remove('muted');
    }).catch(() => {});
  }
  document.body.removeEventListener('click', iniciarMusica);
}, { once: true });
</script>
</body>
</html>
